[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "endritdobra", email = "endrit.dobra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "ddgs>=9.16.0",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-course = "langgraph_course:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
