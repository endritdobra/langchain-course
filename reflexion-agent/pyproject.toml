[project]
name = "reflexion-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "endritdobra", email = "endrit.dobra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
]

[project.scripts]
reflexion-agent = "reflexion_agent:main"

[build-system]
